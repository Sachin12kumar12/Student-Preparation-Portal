<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Result - Student Preparation Portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f4f6f9;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .result-container {
            max-width: 700px;
            margin: 60px auto;
        }

        .result-card {
            text-align: center;
            padding: 40px;
        }

        .score {
            font-size: 55px;
            font-weight: bold;
        }

        .result-icon {
            font-size: 60px;
        }

        .stat-box {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
        }

    </style>

</head>

<body>


    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="dashboard.html">
                Student Preparation Portal
            </a>

            <a href="dashboard.html"
                class="btn btn-outline-light btn-sm">

                Dashboard

            </a>

        </div>

    </nav>


    <!-- Result -->

    <div class="container result-container">

        <div class="card shadow result-card">

            <div class="result-icon">
                🏆
            </div>

            <h1 class="mt-3">
                Test Completed!
            </h1>

            <p class="text-muted">
                Your mock test result is given below.
            </p>


            <!-- Score -->

            <div class="score text-primary"
                id="score">

                0/0

            </div>

            <p>
                Your Score
            </p>


            <!-- Result Status -->

            <h3 id="resultStatus">
                Result
            </h3>


            <hr>


            <!-- Statistics -->

            <div class="row g-3 mt-3">


                <!-- Correct -->

                <div class="col-md-4">

                    <div class="stat-box">

                        <h4 id="correctAnswers">
                            0
                        </h4>

                        <p class="mb-0">
                            Correct
                        </p>

                    </div>

                </div>


                <!-- Wrong -->

                <div class="col-md-4">

                    <div class="stat-box">

                        <h4 id="wrongAnswers">
                            0
                        </h4>

                        <p class="mb-0">
                            Wrong
                        </p>

                    </div>

                </div>


                <!-- Percentage -->

                <div class="col-md-4">

                    <div class="stat-box">

                        <h4 id="percentage">
                            0%
                        </h4>

                        <p class="mb-0">
                            Percentage
                        </p>

                    </div>

                </div>

            </div>


            <!-- Buttons -->

            <div class="mt-4">

                <a href="mock-tests.html"
                    class="btn btn-primary me-2">

                    Try Again

                </a>


                <a href="dashboard.html"
                    class="btn btn-secondary">

                    Dashboard

                </a>

            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script>

        // Get score from localStorage

        let score =
            parseInt(
                localStorage.getItem("testScore")
            );


        let totalQuestions =
            parseInt(
                localStorage.getItem("totalQuestions")
            );


        // If data is not available

        if (
            isNaN(score) ||
            isNaN(totalQuestions)
        ) {

            score = 0;

            totalQuestions = 0;

        }


        // Calculate wrong answers

        let wrongAnswers =
            totalQuestions - score;


        // Calculate percentage

        let percentage = 0;

        if (totalQuestions > 0) {

            percentage =
                (score / totalQuestions) * 100;

        }


        // Display score

        document.getElementById(
            "score"
        ).innerText =
            score + "/" + totalQuestions;


        // Display correct answers

        document.getElementById(
            "correctAnswers"
        ).innerText =
            score;


        // Display wrong answers

        document.getElementById(
            "wrongAnswers"
        ).innerText =
            wrongAnswers;


        // Display percentage

        document.getElementById(
            "percentage"
        ).innerText =
            percentage.toFixed(2) + "%";


        // Pass / Fail

        if (percentage >= 40) {

            document.getElementById(
                "resultStatus"
            ).innerText =
                "PASS ✅";

            document.getElementById(
                "resultStatus"
            ).className =
                "text-success";

        } else {

            document.getElementById(
                "resultStatus"
            ).innerText =
                "FAIL ❌";

            document.getElementById(
                "resultStatus"
            ).className =
                "text-danger";

        }

    </script>


</body>

</html>
