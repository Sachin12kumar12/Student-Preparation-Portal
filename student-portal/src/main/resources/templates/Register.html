```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Student Preparation Portal
            </a>

        </div>

    </nav>



    <!-- Registration Form -->

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Student Registration
                        </h2>


                        <form>


                            <!-- Name -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter your name"
                                    required
                                >

                            </div>



                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>



                            <!-- Mobile -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Mobile Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    placeholder="Enter mobile number"
                                    required
                                >

                            </div>



                            <!-- College -->

                            <div class="mb-3">

                                <label class="form-label">
                                    College
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter college name"
                                    required
                                >

                            </div>



                            <!-- Branch -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Branch
                                </label>

                                <select class="form-select" required>

                                    <option value="">
                                        Select Branch
                                    </option>

                                    <option value="CSE">
                                        Computer Science Engineering
                                    </option>

                                    <option value="IT">
                                        Information Technology
                                    </option>

                                    <option value="ECE">
                                        Electronics & Communication
                                    </option>

                                    <option value="ME">
                                        Mechanical Engineering
                                    </option>

                                    <option value="CE">
                                        Civil Engineering
                                    </option>

                                </select>

                            </div>



                            <!-- Year -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Year
                                </label>

                                <select class="form-select" required>

                                    <option value="">
                                        Select Year
                                    </option>

                                    <option value="1">
                                        1st Year
                                    </option>

                                    <option value="2">
                                        2nd Year
                                    </option>

                                    <option value="3">
                                        3rd Year
                                    </option>

                                    <option value="4">
                                        Final Year
                                    </option>

                                </select>

                            </div>



                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    placeholder="Create password"
                                    required
                                >

                            </div>



                            <!-- Confirm Password -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    placeholder="Confirm password"
                                    required
                                >

                            </div>



                            <!-- Register Button -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Register
                                </button>

                            </div>


                        </form>



                        <!-- Login Link -->

                        <p class="text-center mt-3">

                            Already have an account?

                            <a href="login.html">
                                Login
                            </a>

                        </p>


                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- Footer -->

    <footer class="bg-dark text-white text-center p-3 mt-5">

        <p class="mb-0">
            © 2026 Student Preparation Portal
        </p>

    </footer>


</body>

</html>
