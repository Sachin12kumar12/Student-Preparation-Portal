<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Result - Student Preparation Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .navbar-brand { font-weight: bold; }

        .result-container {
            width: 100%;
            max-width: 950px;
            margin: 25px auto 45px;
            padding: 0 16px;
        }

        .result-card {
            background: white;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
            text-align: center;
        }

        .result-icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #e8f5e9;
            color: #198754;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: bold;
        }

        .test-name {
            font-size: clamp(23px, 4vw, 30px);
            font-weight: bold;
            margin-bottom: 25px;
            overflow-wrap: anywhere;
        }

        .score-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 22px 0;
        }

        .score-item {
            padding: 20px 12px;
            border-radius: 12px;
            background: #f8f9fa;
        }

        .score-number {
            font-size: 30px;
            font-weight: bold;
        }

        .score-label {
            color: #666;
            margin-top: 5px;
        }

        .percentage {
            font-size: 38px;
            font-weight: bold;
            color: #0d6efd;
        }

        .progress {
            height: 18px;
            margin: 20px 0 25px;
        }

        .review-title {
            text-align: left;
            margin-top: 35px;
            border-top: 1px solid #ddd;
            padding-top: 25px;
        }

        .review-item {
            text-align: left;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            background: #fff;
        }

        .review-item.correct {
            border-left: 5px solid #198754;
        }

        .review-item.wrong {
            border-left: 5px solid #dc3545;
        }

        .review-question {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .answer-correct { color: #198754; font-weight: bold; }
        .answer-wrong { color: #dc3545; font-weight: bold; }
        .answer-muted { color: #6c757d; }

        .action-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 25px;
        }

        @media (max-width: 700px) {
            .result-container { padding: 0 10px; }
            .result-card { padding: 24px 15px; }
            .score-box { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Student Preparation Portal</a>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
    </div>
</nav>

<div class="container result-container">
    <div class="result-card">

        <div class="result-icon" id="resultIcon">✓</div>

        <h2>Test Completed!</h2>

        <div class="test-name" id="testName">Mock Test</div>

        <div class="score-box">
            <div class="score-item">
                <div class="score-number" id="score">0</div>
                <div class="score-label">Correct Answers</div>
            </div>

            <div class="score-item">
                <div class="score-number" id="wrong">0</div>
                <div class="score-label">Wrong Answers</div>
            </div>

            <div class="score-item">
                <div class="percentage" id="percentage">0%</div>
                <div class="score-label">Percentage</div>
            </div>
        </div>

        <div class="text-muted mb-2">
            Total Questions: <strong id="totalQuestions">0</strong>
        </div>

        <div class="progress">
            <div id="progressBar" class="progress-bar" role="progressbar" style="width:0%">
                0%
            </div>
        </div>

        <p id="message" class="fs-5"></p>

        <div class="action-buttons">
            <a href="Dashboard" class="btn btn-success">
                Check Dashboard
            </a>
            <a href="Mock-Test_page" class="btn btn-outline-secondary">
                Back to Mock Tests
            </a>
        </div>

        <div class="review-title">
            <h4>Question-wise Result</h4>
            <p class="text-muted">Your selected answer is compared with the correct answer.</p>
        </div>

        <div id="review"></div>
    </div>
</div>

<script>
    const score = Number(localStorage.getItem("testScore")) || 0;
    const totalQuestions = Number(localStorage.getItem("totalQuestions")) || 0;
    const testName = localStorage.getItem("testName") || "Mock Test";
    const testType = (localStorage.getItem("testType") || "aptitude").toLowerCase();

    let details = [];

    try {
        details = JSON.parse(localStorage.getItem("testAnswers") || "[]");
        if (!Array.isArray(details)) details = [];
    } catch (e) {
        details = [];
    }

    const calculatedScore = details.length
        ? details.filter(item => item.isCorrect === true).length
        : score;

    const total = details.length || totalQuestions;
    const wrong = Math.max(total - calculatedScore, 0);
    const percentage = total > 0 ? Math.round((calculatedScore / total) * 100) : 0;

    document.getElementById("testName").textContent = testName;
    document.getElementById("score").textContent = calculatedScore;
    document.getElementById("wrong").textContent = wrong;
    document.getElementById("totalQuestions").textContent = total;
    document.getElementById("percentage").textContent = percentage + "%";

    const bar = document.getElementById("progressBar");
    bar.style.width = percentage + "%";
    bar.textContent = percentage + "%";

    const message = document.getElementById("message");

    if (percentage >= 80) {
        message.textContent = "Excellent! Your preparation is going very well.";
    } else if (percentage >= 60) {
        message.textContent = "Good job! Keep practicing to improve your score.";
    } else if (percentage >= 40) {
        message.textContent = "Keep practicing. You can improve with regular revision.";
    } else {
        message.textContent = "Don't worry. Revise the topics and try the test again.";
    }

    const takeAnother = document.getElementById("takeAnother");

    if (testType === "reasoning") {
        takeAnother.href = "Test.html?test=reasoning";
    } else if (testType === "technical") {
        takeAnother.href = "Test.html?test=technical";
    } else if (testType === "placement") {
        takeAnother.href = "Test.html?test=placement";
    } else {
        takeAnother.href = "Test.html?test=aptitude";
    }

    const review = document.getElementById("review");

    if (details.length === 0) {
        review.innerHTML =
            '<div class="alert alert-warning">Question-wise result data is not available. Please take the test again using the updated Test.html.</div>';
    } else {
        details.forEach((item, index) => {
            const selectedText =
                item.selected && item.options && item.options[item.selected]
                    ? item.selected + ". " + item.options[item.selected]
                    : "Not answered";

            const correctText =
                item.correct && item.options && item.options[item.correct]
                    ? item.correct + ". " + item.options[item.correct]
                    : item.correct || "Not available";

            const statusClass = item.isCorrect ? "correct" : "wrong";
            const statusText = item.isCorrect ? "Correct" : "Wrong";

            const div = document.createElement("div");
            div.className = "review-item " + statusClass;

            div.innerHTML = `
            <div class="review-question">
                Q${index + 1}. ${escapeHtml(item.question)}
            </div>
            <div class="${item.isCorrect ? "answer-correct" : "answer-wrong"}">
                Status: ${statusText}
            </div>
            <div class="mt-1">
                Your Answer:
                <span class="${item.selected ? "" : "answer-muted"}">
                    ${escapeHtml(selectedText)}
                </span>
            </div>
            <div class="mt-1">
                Correct Answer:
                <span class="answer-correct">
                    ${escapeHtml(correctText)}
                </span>
            </div>
        `;

            review.appendChild(div);
        });
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
