        // =========================
        // QUESTIONS SELECT KARNA
        // =========================

        let questions = questionDatabase[topic];


        // Agar topic database me nahi hai

        if (!questions) {

            questions = questionDatabase.percentage;

        }



        // Current question

        let currentQuestion = 0;

        let score = 0;

        let answerSubmitted = false;



        // Topic ka naam screen par show karna

        let topicName = topic
            .replaceAll("_", " ")
            .replace(/\b\w/g, function(letter) {

                return letter.toUpperCase();

            });


        document.getElementById("topicTitle").innerText =
            topicName + " Questions";



        // =========================
        // QUESTION SHOW KARNA
        // =========================

        function showQuestion() {

            let question = questions[currentQuestion];


            document.getElementById("questionNumber").innerText =
                "Question " + (currentQuestion + 1) +
                " / " + questions.length;


            document.getElementById("questionText").innerText =
                question.question;


            let optionsHTML = "";


            question.options.forEach(function(option, index) {

                optionsHTML += `

                    <div class="form-check mb-2">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="answer"
                            id="option${index}"
                            value="${option}"
                        >

                        <label
                            class="form-check-label"
                            for="option${index}"
                        >
                            ${option}
                        </label>

                    </div>

                `;

            });


            document.getElementById("options").innerHTML =
                optionsHTML;


            document.getElementById("submitBtn").style.display =
                "inline-block";


            document.getElementById("nextBtn").style.display =
                "none";


            document.getElementById("previousBtn").style.display =
                currentQuestion > 0 ? "inline-block" : "none";


            document.getElementById("result").style.display =
                "none";


            answerSubmitted = false;

        }



        // =========================
        // ANSWER SUBMIT
        // =========================

        function submitAnswer() {

            if (answerSubmitted) {
                return;
            }


            let selected = document.querySelector(
                'input[name="answer"]:checked'
            );


            if (!selected) {

                alert("Please select an answer.");

                return;

            }


            let correctAnswer =
                questions[currentQuestion].answer;


            if (selected.value === correctAnswer) {

                score++;

                document.getElementById("result").innerText =
                    "Correct Answer!";

            } else {

                document.getElementById("result").innerText =
                    "Wrong Answer! Correct answer is: " +
                    correctAnswer;

            }


            document.getElementById("result").style.display =
                "block";


            document.getElementById("submitBtn").style.display =
                "none";


            document.getElementById("nextBtn").style.display =
                "inline-block";


            answerSubmitted = true;

        }



        // =========================
        // NEXT QUESTION
        // =========================

        function nextQuestion() {

            if (currentQuestion < questions.length - 1) {

                currentQuestion++;

                showQuestion();

            } else {

                document.getElementById("result").innerText =
                    "Test Completed! Your Score: " +
                    score + " / " + questions.length;

                document.getElementById("result").style.display =
                    "block";


                document.getElementById("nextBtn").style.display =
                    "none";

            }

        }



        // =========================
        // PREVIOUS QUESTION
        // =========================

        function previousQuestion() {

            if (currentQuestion > 0) {

                currentQuestion--;

                showQuestion();

            }

        }



        // First question show

        showQuestion();


    </script>

    <script type="text/javascript">
        let currentLang = 'en';

        // Page load hone par auto-translate rokar English me fix rakhne ke liye cookie clear karein
        document.addEventListener("DOMContentLoaded", function() {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + document.domain + "; path=/;";
            currentLang = 'en';
            document.getElementById("langToggleBtn").innerText = "हिंदी (Hindi)";
        });

        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'hi,en',
                autoDisplay: false
            }, 'google_translate_element');
        }

        // Single Button Toggle Logic (English ⟷ Hindi)
        function toggleLanguage() {
            var btn = document.getElementById("langToggleBtn");
            var selectField = document.querySelector(".goog-te-combo");

            if (currentLang === 'en') {
                // Switch to Hindi
                if (selectField) {
                    selectField.value = 'hi';
                    selectField.dispatchEvent(new Event('change'));
                } else {
                    document.cookie = "googtrans=/en/hi; path=/";
                    location.reload();
                }
                btn.innerText = "English";
                currentLang = 'hi';
            } else {
                // Switch back to English
                if (selectField) {
                    selectField.value = 'en';
                    selectField.dispatchEvent(new Event('change'));
                } else {
                    document.cookie = "googtrans=/en/en; path=/";
                    location.reload();
                }
                btn.innerText = "हिंदी (Hindi)";
                currentLang = 'en';
            }
        }
    </script>
